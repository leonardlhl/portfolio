<script type="module">
// WebKit resolves a relative inline import from the document URL rather than
// its <base>. Resolve explicitly so /m/ loads the same root journey as desktop.
if (!document.documentElement.dataset.mobileRedirect) {
 import(new URL('./journey.js?v=41', document.baseURI).href).catch(error => {
  const loading = document.getElementById('loading');
  loading.hidden = false;
  loading.textContent = 'The portfolio could not load. ';
  const retry = document.createElement('button');
  retry.type = 'button';
  retry.textContent = 'Try again';
  retry.addEventListener('click', () => location.reload());
  loading.append(retry);
  console.error('Portfolio startup failed:', error);
 });
}
